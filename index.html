<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LabTeknøRadiø — DaløreX</title>
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(20, 20, 25, 0.85);
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --text-main: #e0e0e0;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Decoración de Stickers */
    #stickersContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .dj-sticker {
      position: absolute;
      max-width: 100px;
      max-height: 100px;
      filter: drop-shadow(0 0 5px rgba(0,243,255,0.4));
      opacity: 0.85;
      transition: transform 0.3s ease;
    }

    /* Chasis Principal */
    .player-container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.05);
      padding: 20px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Pantalla Central / Visualizador */
    .display-screen {
      position: relative;
      width: 100%;
      height: 260px;
      background: #000000;
      border: 2px solid #1a1a24;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }

    #vizCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .screen-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 12px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }

    .radio-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    .status-text {
      position: relative;
      z-index: 2;
      margin-bottom: 15px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255, 0, 85, 0.8);
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 0, 85, 0.3);
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Botones de Control de Modo */
    .controls-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      background: #121218;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #888;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .mode-btn.active {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    /* Panel Inferior / Acciones */
    .bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 5px;
    }

    .bottom-btn, .upload-btn-label {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ccc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .bottom-btn:hover, .upload-btn-label:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    #stickerUpload {
      display: none;
    }

    /* Modal Legal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #14141d;
      border: 1px solid var(--neon-magenta);
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
    }

    .modal-card h2 {
      color: var(--neon-magenta);
      font-size: 1.2rem;
      margin-bottom: 12px;
    }

    .modal-card p {
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .modal-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-links a {
      color: var(--neon-cyan);
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .btn-accept {
      background: var(--neon-magenta);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }
  </style>
</head>
<body>

  <!-- Contenedor de Stickers dinámicos -->
  <div id="stickersContainer"></div>

  <!-- Modal Términos Legales -->
  <div id="legalModal" class="modal-overlay">
    <div class="modal-card">
      <h2>LABTEKNØRADIØ</h2>
      <p>Bienvenido al laboratorio oficial de DaløreX. Para acceder a la transmisión continua de audio y funciones exclusivas, debes aceptar los términos.</p>
      <div class="modal-links">
        <a id="linkPrivacy">Privacidad</a>
        <a id="linkTerms">Términos</a>
      </div>
      <button id="acceptLegalBtn" class="btn-accept">ACEPTAR Y ENTRAR</button>
    </div>
  </div>

  <!-- Chasis del Reproductor -->
  <div class="player-container">
    
    <!-- Pantalla / Canvas Visualizador -->
    <div class="display-screen">
      <canvas id="vizCanvas"></canvas>
      <div class="screen-overlay">
        <div class="radio-title">LABTEKNØ RADIØ</div>
      </div>
      <div id="statusMessage" class="status-text">ACEPTA LOS TÉRMINOS PRIMERO</div>
    </div>

    <!-- Modos de Reproducción -->
    <div class="controls-row">
      <button id="btnPlaylist" class="mode-btn active">SET / TRACKS</button>
      <button id="btnMix" class="mode-btn">MIX MODO</button>
    </div>

    <!-- Acciones e Integración -->
    <div class="bottom-actions">
      <label for="stickerUpload" class="upload-btn-label">+ STICKER</label>
      <input type="file" id="stickerUpload" accept="image/*" multiple>

      <a id="openTermsBtn" class="bottom-btn">LEGAL</a>
      <a id="paypalLink" target="_blank" rel="noopener" class="bottom-btn" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">APOYAR</a>
    </div>

  </div>

  <!-- Carga del Script del reproductor -->
  <script src="ap.js"></script>
</body>
</html>
